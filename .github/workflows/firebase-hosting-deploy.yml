name: Deploy Web to Firebase Hosting

on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "web/**"
      - "firebase.json"
      - ".github/workflows/firebase-hosting-deploy.yml"
  workflow_dispatch:

# Node 20 wird auf den Runnern abgekuendigt. checkout/setup-node laufen ueber
# v5 bereits auf Node 24; fuer die FirebaseExtended-Action (noch kein Node-24-
# Release) opten wir per Flag in den Node-24-Modus.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build static export
        working-directory: web
        run: npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STOCKWAAGE }}
          projectId: stockwaage-132b6
          channelId: live
          entryPoint: .
