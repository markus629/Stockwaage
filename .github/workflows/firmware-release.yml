name: Firmware Release

# Baut bei jedem Push, der firmware/ aendert, automatisch eine neue
# Binary und veroeffentlicht sie als GitHub-Release v0.1.<build-nummer>.
# ESPs mit aktiviertem Auto-Update ziehen sie beim naechsten Wakeup.
on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "firmware/**"
      - "!firmware/**/*.md"
      - ".github/workflows/firmware-release.yml"
  workflow_dispatch:

# Node 20 wird auf den Runnern abgekuendigt. checkout laeuft ueber v5 auf
# Node 24; fuer die uebrigen JS-Actions (cache, action-gh-release,
# setup-arduino-cli) opten wir per Flag in den Node-24-Modus.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Determine version
        id: ver
        run: echo "version=v0.1.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Setup arduino-cli
        uses: arduino/setup-arduino-cli@v2

      - name: Configure board indexes
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls \
            https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index

      - name: Cache ESP32 core
        uses: actions/cache@v4
        with:
          path: ~/.arduino15
          key: arduino-esp32-${{ runner.os }}-v3.3.8

      - name: Install ESP32 core
        run: arduino-cli core install esp32:esp32@3.3.8

      - name: Install libraries
        run: |
          arduino-cli lib install \
            "ArduinoJson" \
            "HX711 Arduino Library" \
            "WiFiManager" \
            "Adafruit BME280 Library" \
            "Adafruit INA219" \
            "Adafruit Unified Sensor"

      - name: Compile
        run: |
          mkdir -p build
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32s3:PSRAM=opi,FlashSize=16M,PartitionScheme=custom" \
            --build-property 'compiler.cpp.extra_flags=-DFIRMWARE_VERSION="${{ steps.ver.outputs.version }}"' \
            --output-dir build \
            firmware/stockwaage

      - name: Stage release artifacts
        run: |
          mkdir -p release
          cp build/stockwaage.ino.bin            release/stockwaage-${{ steps.ver.outputs.version }}.bin
          cp build/stockwaage.ino.bootloader.bin release/bootloader.bin
          cp build/stockwaage.ino.partitions.bin release/partitions.bin

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: |
            release/stockwaage-${{ steps.ver.outputs.version }}.bin
            release/bootloader.bin
            release/partitions.bin
          body: |
            Automatischer Build von Commit ${{ github.sha }}.

            ## OTA-Update
            Wird im Web-UI unter **Einstellungen → Firmware** als
            ${{ steps.ver.outputs.version }} angeboten (bzw. automatisch
            installiert, wenn Auto-Update aktiv ist).

            ## Erst-Flash (oder Recovery)
            Drei Dateien mit folgenden Adressen flashen
            (esptool.py oder Web-Flasher):
            - `bootloader.bin` → `0x0`
            - `partitions.bin` → `0x8000`
            - `stockwaage-${{ steps.ver.outputs.version }}.bin` → `0x10000`
