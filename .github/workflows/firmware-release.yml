name: Firmware Release

# Baut bei jedem Push, der firmware/ aendert, BEIDE Varianten (S3 = mehrere
# Waagen, C5 = eine Waage) und veroeffentlicht sie als GitHub-Release
# v0.1.<build-nummer>. Jeder ESP zieht per OTA das zu seinem Typ passende
# Asset (stockwaage-s3-* bzw. stockwaage-c5-*).
on:
  push:
    branches: [main]
    paths:
      - "firmware/**"
      - "!firmware/**/*.md"
      - ".github/workflows/firmware-release.yml"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Determine version
        id: ver
        run: echo "version=v0.1.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Setup arduino-cli
        uses: arduino/setup-arduino-cli@v2

      - name: Configure board indexes
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls \
            https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index

      - name: Cache ESP32 core
        uses: actions/cache@v4
        with:
          path: ~/.arduino15
          key: arduino-esp32-${{ runner.os }}-v3.3.8

      - name: Install ESP32 core
        run: arduino-cli core install esp32:esp32@3.3.8

      - name: Install libraries
        run: |
          arduino-cli lib install \
            "ArduinoJson" \
            "HX711 Arduino Library" \
            "WiFiManager" \
            "Adafruit BMP280 Library" \
            "Adafruit INA219" \
            "Adafruit NeoPixel" \
            "Adafruit Unified Sensor"

      - name: Generate version headers
        run: |
          for v in s3 c5; do
            printf '#define FIRMWARE_VERSION "%s"\n' \
              "${{ steps.ver.outputs.version }}" \
              > firmware/stockwaage-$v/fw_version.h
          done

      - name: Compile S3 (mehrere Waagen)
        run: |
          mkdir -p build-s3
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32s3:PSRAM=opi,FlashSize=16M,PartitionScheme=custom" \
            --output-dir build-s3 \
            firmware/stockwaage-s3

      - name: Compile C5 (eine Waage)
        id: c5
        continue-on-error: true
        run: |
          mkdir -p build-c5
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32c5:FlashSize=4M,PartitionScheme=custom" \
            --build-property "compiler.cpp.extra_flags=-DBOARD_XIAO_C5=1" \
            --output-dir build-c5 \
            firmware/stockwaage-c5

      - name: Stage release artifacts
        run: |
          mkdir -p release
          V=${{ steps.ver.outputs.version }}
          # S3 (muss vorhanden sein)
          cp build-s3/stockwaage-s3.ino.bin            release/stockwaage-s3-$V.bin
          cp build-s3/stockwaage-s3.ino.bootloader.bin release/bootloader-s3.bin
          cp build-s3/stockwaage-s3.ino.partitions.bin release/partitions-s3.bin
          # C5 (best effort – nur wenn Compile geklappt hat)
          if [ -f build-c5/stockwaage-c5.ino.bin ]; then
            cp build-c5/stockwaage-c5.ino.bin            release/stockwaage-c5-$V.bin
            cp build-c5/stockwaage-c5.ino.bootloader.bin release/bootloader-c5.bin
            cp build-c5/stockwaage-c5.ino.partitions.bin release/partitions-c5.bin
          else
            echo "::warning::C5-Build fehlgeschlagen oder C5-Core fehlt – nur S3 im Release."
          fi
          ls -l release

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: release/*
          body: |
            Automatischer Build von Commit ${{ github.sha }}.

            Zwei Varianten:
            - **S3** (Bienenstand, mehrere Waagen): `stockwaage-s3-${{ steps.ver.outputs.version }}.bin`
              + `bootloader-s3.bin` (`0x0`) + `partitions-s3.bin` (`0x8000`), App → `0x10000`.
            - **C5** (eine Waage): `stockwaage-c5-${{ steps.ver.outputs.version }}.bin`
              + `bootloader-c5.bin` (`0x0`) + `partitions-c5.bin` (`0x8000`), App → `0x10000`.

            Im Web-UI (Einstellungen → Firmware) zieht jeder ESP automatisch das
            zu seinem Typ passende Asset.
